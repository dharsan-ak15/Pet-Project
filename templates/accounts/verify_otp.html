{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="glass-card p-5 scroll-reveal">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock-fill display-1 text-primary mb-3"></i>
                    <h2 class="fw-bold">Verify Your {{ otp_type }}</h2>
                    <p class="text-muted">Enter the 6-digit code sent to your {{ otp_type|lower }}.</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="form-group-modern mb-4">
                        <input type="text" name="otp_code" id="id_otp_code" class="form-control-modern text-center fs-3 fw-bold" 
                               placeholder=" " maxlength="6" required pattern="\d{6}">
                        <label for="id_otp_code" class="form-label-modern">OTP Code</label>
                    </div>

                    <button type="submit" class="btn-premium btn-premium-primary w-100 mb-3 magnetic">
                        Verify Code
                    </button>
                    
                    <a href="{% url 'send-otp' otp_type %}" class="btn-premium btn-premium-outline w-100 magnetic">
                        Resend OTP
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
