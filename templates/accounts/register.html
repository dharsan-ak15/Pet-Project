{% extends 'base.html' %}
{% load static %}
{% block content %}

<style>
    .auth-bg {
        background: url("{% static 'images/auth-bg.png' %}") center center/cover no-repeat;
        min-height: calc(100vh - 76px);
        border-top-right-radius: 20px;
        border-bottom-right-radius: 20px;
        box-shadow: inset 10px 0 20px rgba(0, 0, 0, 0.1);
        transform: scaleX(-1);
        /* Flips the image so the dog is on the right, for variety! */
    }

    .auth-form-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 4rem;
        min-height: calc(100vh - 76px);
    }

    .auth-card {
        border: none;
        border-radius: 15px;
        background: white;
    }

    @media (max-width: 768px) {
        .auth-bg {
            min-height: 250px;
            border-radius: 0;
            transform: none;
        }

        .auth-form-container {
            padding: 2rem;
            min-height: auto;
        }
    }
</style>

<div class="container-fluid p-0">
    <div class="row g-0 flex-row-reverse">
        <!-- Image Side -->
        <div class="col-md-6 d-none d-md-block auth-bg">
        </div>

        <!-- Form Side -->
        <div class="col-md-6 auth-form-container bg-white">
            <div class="mx-auto w-100" style="max-width: 480px;">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark"><i class="bi bi-person-plus text-primary me-2"></i>Join the Community
                    </h2>
                    <p class="text-muted">Create an account to report pets and help reunite families.</p>
                </div>

                <div class="card auth-card shadow-lg">
                    <div class="card-body p-4">
                        <form method="post" novalidate>
                            {% csrf_token %}
                            {{ form.as_p }}
                            <button class="btn btn-primary btn-lg w-100 mt-4 rounded-pill fw-bold shadow-sm"
                                type="submit">
                                Create Account <i class="bi bi-person-check ms-1"></i>
                            </button>
                        </form>
                    </div>
                </div>

                <p class="text-center mt-4 mb-0 text-muted">
                    Already have an account? <a href="{% url 'login' %}" class="fw-bold text-decoration-none">Login
                        here</a>
                </p>
            </div>
        </div>
    </div>
</div>

{% endblock %}
